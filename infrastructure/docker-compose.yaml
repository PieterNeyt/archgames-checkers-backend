version: '3.9'

name: checkers

services:
  game_postgres:
    image: postgres:17.1-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: checkersDb
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5445:5432"
